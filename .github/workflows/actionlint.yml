name: Workflow Lint

on:
  workflow_dispatch:
  push:
    branches:
      - muffin-fork
      - 'feature/**'
      - 'fix/**'
    paths:
      - '.github/workflows/**'
  pull_request:
    branches:
      - muffin-fork
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Validate GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Install verified actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          install -m 0755 actionlint "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint" -version

      - name: Validate workflows
        run: |
          "$RUNNER_TEMP/actionlint" -color -ignore "SC2129"
