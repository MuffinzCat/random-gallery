name: Android CI

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 6'
  push:
    branches:
      - muffin-fork
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - muffin-fork

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew app:testDebugUnitTest --console=plain

      - name: Android lint
        run: ./gradlew app:lintDebug --console=plain

      - name: Kotlin style check
        run: ./gradlew app:ktlintCheck --console=plain

      - name: Build debug APK
        run: ./gradlew app:assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: random-gallery-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ci-reports-${{ github.sha }}
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
          retention-days: 14
