name: Upstream Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  group: upstream-integration
  cancel-in-progress: false

jobs:
  integrate:
    name: Prepare upstream release integration
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Muffin fork
        uses: actions/checkout@v7
        with:
          ref: muffin-fork
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Fetch upstream releases
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/lvlh2/random-gallery.git
          git fetch upstream master --tags --force

      - name: Detect latest upstream release
        id: upstream
        run: |
          LATEST_TAG=$(git tag --merged upstream/master --list 'v[0-9]*' --sort=-version:refname | head -n1)
          if [[ -z "$LATEST_TAG" ]]; then
            echo "No upstream version tag was found." >&2
            exit 1
          fi

          UPSTREAM_REF="refs/tags/$LATEST_TAG"
          if git merge-base --is-ancestor "$UPSTREAM_REF" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Latest upstream release $LATEST_TAG is already integrated."
            exit 0
          fi

          UPSTREAM_VERSION="${LATEST_TAG#v}"
          UPSTREAM_CODE=$(git show "$UPSTREAM_REF":app/build.gradle.kts | sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' | head -n1)
          CURRENT_CODE=$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          CURRENT_VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          CURRENT_BASE="${CURRENT_VERSION%%-muffin.*}"

          if [[ -z "$UPSTREAM_VERSION" || -z "$UPSTREAM_CODE" || -z "$CURRENT_CODE" || -z "$CURRENT_BASE" ]]; then
            echo "Could not determine upstream or current version information." >&2
            exit 1
          fi

          if [[ "$UPSTREAM_VERSION" == "$CURRENT_BASE" ]]; then
            echo "Upstream release $UPSTREAM_VERSION matches the current fork base; refusing to reuse an existing Muffin release series." >&2
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "upstream_ref=$UPSTREAM_REF" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "upstream_code=$UPSTREAM_CODE" >> "$GITHUB_OUTPUT"
          echo "current_code=$CURRENT_CODE" >> "$GITHUB_OUTPUT"

      - name: Create integration branch and merge upstream release
        if: steps.upstream.outputs.changed == 'true'
        env:
          UPSTREAM_REF: ${{ steps.upstream.outputs.upstream_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C automation/upstream-sync
          if ! git merge --no-edit "$UPSTREAM_REF"; then
            git merge --abort || true
            echo "Upstream release has merge conflicts. muffin-fork was not changed." >&2
            exit 1
          fi

      - name: Apply Muffin release version
        if: steps.upstream.outputs.changed == 'true'
        env:
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.upstream_version }}
          UPSTREAM_CODE: ${{ steps.upstream.outputs.upstream_code }}
          CURRENT_CODE: ${{ steps.upstream.outputs.current_code }}
        run: |
          if (( UPSTREAM_CODE > CURRENT_CODE )); then
            NEW_CODE=$((UPSTREAM_CODE + 1))
          else
            NEW_CODE=$((CURRENT_CODE + 1))
          fi

          NEW_VERSION="$UPSTREAM_VERSION-muffin.1"
          sed -i -E "s/^([[:space:]]*)versionCode = [0-9]+/\1versionCode = $NEW_CODE/" app/build.gradle.kts
          sed -i -E "s/^([[:space:]]*)versionName = \"[^\"]+\"/\1versionName = \"$NEW_VERSION\"/" app/build.gradle.kts

          grep -F "versionCode = $NEW_CODE" app/build.gradle.kts
          grep -F "versionName = \"$NEW_VERSION\"" app/build.gradle.kts

          git add app/build.gradle.kts
          git commit -m "chore: integrate upstream release $UPSTREAM_VERSION"
          echo "NEW_CODE=$NEW_CODE" >> "$GITHUB_ENV"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Unit tests
        if: steps.upstream.outputs.changed == 'true'
        run: ./gradlew app:testDebugUnitTest --console=plain

      - name: Kotlin style check
        if: steps.upstream.outputs.changed == 'true'
        run: ./gradlew app:ktlintCheck --console=plain

      - name: Android lint
        if: steps.upstream.outputs.changed == 'true'
        run: ./gradlew app:lintDebug --console=plain

      - name: Build release APK
        if: steps.upstream.outputs.changed == 'true'
        run: ./gradlew app:assembleRelease --console=plain

      - name: Verify muffin-fork has not moved
        if: steps.upstream.outputs.changed == 'true'
        run: |
          git fetch origin muffin-fork
          EXPECTED_BASE=$(git merge-base automation/upstream-sync origin/muffin-fork)
          CURRENT_HEAD=$(git rev-parse origin/muffin-fork)
          if [[ "$EXPECTED_BASE" != "$CURRENT_HEAD" ]]; then
            echo "muffin-fork moved while integration was running; refusing to publish stale integration." >&2
            exit 1
          fi

      - name: Publish validated integration branch
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin automation/upstream-sync:refs/remotes/origin/automation/upstream-sync 2>/dev/null || true
          git push --force-with-lease origin automation/upstream-sync

      - name: Create or update upstream integration pull request
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
        run: |
          EXISTING_PR=$(gh pr list --base muffin-fork --head automation/upstream-sync --state open --json number --jq '.[0].number // empty')
          if [[ -n "$EXISTING_PR" ]]; then
            echo "Updated existing upstream integration PR #$EXISTING_PR."
          else
            printf -v PR_BODY 'Automated integration of upstream Random Gallery release %s.\n\nThe integration branch was created from muffin-fork, merged with the exact upstream release tag, versioned as %s, and passed the upstream integration pre-validation workflow. Final PR checks must pass before merge.' "$UPSTREAM_TAG" "$NEW_VERSION"
            gh pr create --base muffin-fork --head automation/upstream-sync --title "chore: integrate upstream $UPSTREAM_TAG" --body "$PR_BODY"
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Upstream integration" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.upstream.outputs.changed }}" == "true" ]]; then
            echo "- Upstream release: ${{ steps.upstream.outputs.upstream_tag }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Muffin candidate: $NEW_VERSION" >> "$GITHUB_STEP_SUMMARY"
            echo "- Android versionCode: $NEW_CODE" >> "$GITHUB_STEP_SUMMARY"
            echo "- Result: integration branch pushed and pull request created or updated." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Result: latest upstream release is already integrated." >> "$GITHUB_STEP_SUMMARY"
          fi
