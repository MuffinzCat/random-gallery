name: Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Verify debug APK
        run: test -f app/build/outputs/apk/debug/random-gallery-muffin.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: random-gallery-muffin-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/random-gallery-muffin.apk
          if-no-files-found: error
          retention-days: 7
