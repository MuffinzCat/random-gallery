name: Android Release

run-name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the Android version, for example v2.1.0-muffin.1
        required: true
        type: string
      prerelease:
        description: Mark as a prerelease
        required: true
        default: false
        type: boolean
  push:
    branches:
      - muffin-fork
    paths:
      - 'app/build.gradle.kts'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: android-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    name: Validate, build and release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Resolve and validate release version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
            if [[ "${{ github.ref_name }}" != "muffin-fork" ]]; then
              echo "Manual releases must run from muffin-fork." >&2
              exit 1
            fi
          fi
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          EXPECTED_TAG="v${VERSION}"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="$EXPECTED_TAG"
          fi
          if [[ "${{ github.event_name }}" == "push" ]]; then
            CURRENT_HEAD=$(git ls-remote origin refs/heads/muffin-fork | cut -f1)
            TESTED_SHA="${{ github.sha }}"
            if [[ "$TESTED_SHA" != "$CURRENT_HEAD" ]]; then
              echo "A newer muffin-fork commit exists; refusing to release stale tested commit $TESTED_SHA." >&2
              exit 1
            fi
          fi
          if [[ -z "$VERSION" ]]; then
            echo "Could not determine versionName from app/build.gradle.kts." >&2
            exit 1
          fi
          if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
            echo "Release tag $TAG does not match Android versionName $VERSION (expected $EXPECTED_TAG)." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=random-gallery-muffin-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "${{ github.event_name }}" == "push" ]]; then
              echo "Release $TAG already exists; no new app version to publish."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing
        if: steps.version.outputs.should_release == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.RG_APP_SIGNING_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/app-signing.jks"
          chmod 600 "$RUNNER_TEMP/app-signing.jks"

      - name: Build release APK
        if: steps.version.outputs.should_release == 'true'
        env:
          RG_COMMUNITY_SIGNING_STORE_FILE: ${{ runner.temp }}/app-signing.jks
          RG_COMMUNITY_SIGNING_STORE_PASSWORD: ${{ secrets.RG_APP_SIGNING_PASSWORD }}
          RG_COMMUNITY_SIGNING_KEY_ALIAS: app-signing
          RG_COMMUNITY_SIGNING_KEY_PASSWORD: ${{ secrets.RG_APP_SIGNING_PASSWORD }}
        run: ./gradlew app:assembleCommunityRelease --console=plain

      - name: Verify release APK signer
        if: steps.version.outputs.should_release == 'true'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          EXPECTED_SHA256="9a4f0979e975f5827cb376633c7a75a53359eb91a7e022395764a1f30cc26b7a"
          ACTUAL_SHA256=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/community/release/random-gallery-muffin.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "Expected signer: $EXPECTED_SHA256"
          echo "Actual signer:   $ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/app-signing.jks"

      - name: Prepare release assets
        if: steps.version.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APK_NAME: ${{ steps.version.outputs.apk }}
        run: |
          mkdir -p release
          cp app/build/outputs/apk/community/release/random-gallery-muffin.apk "release/$APK_NAME"
          sha256sum "release/$APK_NAME" > "release/$APK_NAME.sha256"

      - name: Verify release APK metadata
        if: steps.version.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APK_NAME: ${{ steps.version.outputs.apk }}
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)
          BADGING=$("$AAPT" dump badging "release/$APK_NAME")
          echo "$BADGING" | grep -F "package: name='com.muffinzcat.randomgallery.community'"
          echo "$BADGING" | grep -F "versionName='$VERSION'"
          echo "$BADGING" | grep -F "application-label:'Shuffler CE'"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "release/$APK_NAME"

      - name: Generate build provenance
        if: steps.version.outputs.should_release == 'true'
        uses: actions/attest@v4
        with:
          subject-path: release/${{ steps.version.outputs.apk }}

      - name: Create GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          APK_NAME: ${{ steps.version.outputs.apk }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          ARGS=("$TAG" "release/$APK_NAME" "release/$APK_NAME.sha256" "--title" "Gallery Shuffler CE $VERSION" "--generate-notes" "--target" "$GITHUB_SHA")
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$PRERELEASE" == "true" ]]; then
            ARGS+=("--prerelease")
          fi
          gh release create "${ARGS[@]}"

      - name: Upload release-build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-release-reports-${{ github.sha }}
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
          retention-days: 14
