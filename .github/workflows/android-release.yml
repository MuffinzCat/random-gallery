name: Android Release

run-name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the Android version, for example v2.1.0-muffin.1
        required: true
        type: string
      prerelease:
        description: Mark as a prerelease
        required: true
        default: false
        type: boolean
  workflow_run:
    workflows:
      - Android CI
    types:
      - completed

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: android-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'muffin-fork' && github.event.workflow_run.event == 'push')
    name: Validate, build and release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Resolve and validate release version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
            if [[ "${{ github.ref_name }}" != "muffin-fork" ]]; then
              echo "Manual releases must run from muffin-fork." >&2
              exit 1
            fi
          fi
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          EXPECTED_TAG="v${VERSION}"
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            TAG="$EXPECTED_TAG"
          fi
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            CURRENT_HEAD=$(git ls-remote origin refs/heads/muffin-fork | cut -f1)
            TESTED_SHA="${{ github.event.workflow_run.head_sha }}"
            if [[ "$TESTED_SHA" != "$CURRENT_HEAD" ]]; then
              echo "A newer muffin-fork commit exists; refusing to release stale tested commit $TESTED_SHA." >&2
              exit 1
            fi
          fi
          if [[ -z "$VERSION" ]]; then
            echo "Could not determine versionName from app/build.gradle.kts." >&2
            exit 1
          fi
          if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
            echo "Release tag $TAG does not match Android versionName $VERSION (expected $EXPECTED_TAG)." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=random-gallery-muffin-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
              echo "Release $TAG already exists; no new app version to publish."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        if: steps.version.outputs.should_release == 'true'
        run: ./gradlew app:testDebugUnitTest --console=plain

      - name: Kotlin style check
        if: steps.version.outputs.should_release == 'true'
        run: ./gradlew app:ktlintCheck --console=plain

      - name: Android lint
        if: steps.version.outputs.should_release == 'true'
        run: ./gradlew app:lintDebug --console=plain

      - name: Build release APK
        if: steps.version.outputs.should_release == 'true'
        run: ./gradlew app:assembleRelease --console=plain

      - name: Prepare release assets
        if: steps.version.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APK_NAME: ${{ steps.version.outputs.apk }}
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/random-gallery-muffin.apk "release/$APK_NAME"
          sha256sum "release/$APK_NAME" > "release/$APK_NAME.sha256"

      - name: Verify release APK metadata
        if: steps.version.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APK_NAME: ${{ steps.version.outputs.apk }}
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)
          BADGING=$("$AAPT" dump badging "release/$APK_NAME")
          echo "$BADGING" | grep -F "package: name='com.muffinzcat.randomgallery'"
          echo "$BADGING" | grep -F "versionName='$VERSION'"
          echo "$BADGING" | grep -F "application-label:'Random Gallery Muffin'"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "release/$APK_NAME"

      - name: Generate build provenance
        if: steps.version.outputs.should_release == 'true'
        uses: actions/attest@v4
        with:
          subject-path: release/${{ steps.version.outputs.apk }}

      - name: Create GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          APK_NAME: ${{ steps.version.outputs.apk }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          ARGS=("$TAG" "release/$APK_NAME" "release/$APK_NAME.sha256" "--title" "Random Gallery Muffin $VERSION" "--generate-notes" "--target" "$GITHUB_SHA")
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "$PRERELEASE" == "true" ]]; then
            ARGS+=("--prerelease")
          fi
          gh release create "${ARGS[@]}"

      - name: Upload release-build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-release-reports-${{ github.sha }}
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
          retention-days: 14
